name: Check Tech News Every 2 Hours

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests feedparser aiohttp rapidfuzz pyyaml

    - name: Run News Script
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        MY_CHAT_ID: ${{ secrets.MY_CHAT_ID }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      run: python main.py

    - name: Commit and Push DB Changes
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        git add seen_news.db
        git commit -m "Update sent news database" || exit 0
        git push
